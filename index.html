<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XHR product crud</title>
    
    <link rel="stylesheet" href="./assests/css/style.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
</head>
<body>
    
    <div class="container p-5">
        <header>
           <div class="row d-flex justify-content-between align-items-center">
              <div class="col-md-6 ">
                  <h1>Flipkart</h1>
              </div>
              <div class="col-md-6">
                 <button class="btn btn-inline-block justify-content-between align-items-center btn-outline-primary" type="button" id="addBtn2">Add Product</button>
                 
                </div>
           </div>
        </header> 
        <div class="row">
            <div class="col-md-6 offset-md-3 mb-4">
               <div class="productModel" id="productModel">
                   <div class="card">
                       <div class="card-header text-center">
                              <h3>Product Card</h3>
                       </div>
                       <div class="card-body">
                            <form action="" id="productForm">
                               <div class="form-group">
                                   <label for="title">Product Name*</label>
                                   <input class="form-control" required type="text" id="title">
                               </div>
       
                               <div class="form-group">
                                   <label for="price">Product Price*</label>
                                   <input class="form-control" required type="number" id="price">
                               </div>
       
                               <div class="form-group">
                                   <label for="img">Product image*</label>
                                   <input class="form-control" required type="text" id="img">
                               </div>
                               <div class="card-footer d-flex justify-content-between ">
                                   <button class="btn btn-inline-block btn-outline-primary" id="addProduct">Add Product </button>
                                   <button class="btn btn-inline-block btn-outline-primary d-none" id="updateProduct" type="button">Update Product</button>
                                   <button class="btn btn-inline-block btn-outline-warning closebackdrop" type="button">Cancel</button>

                               </div>
                            </form>
                       </div>
       
                   </div>
                
               </div>
            </div>
        </div>
    </div> 


   <div class="backdrop closebackdrop" id="backdrop"></div>

    <div class="container-fluid">
         <div class="row" id="productContainer">
            
         </div>
    </div>

<div class="spinner d-none"  id="spinner">
    <div class="spinner-border text-secondary" role="status">
  <span class="sr-only">Loading...</span>
</div>

</div>

     <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assests/js/app.js"></script>
</body>
</html>
